name: Build Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            architecture: x64
          - runtime: win-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: ./build.ps1 -RuntimeIdentifier ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        with:
          name: CGM-Collage-Windows-${{ matrix.architecture }}
          path: artifacts/CGM-Collage-Setup-${{ matrix.architecture }}.exe
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Publish versioned Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          [xml]$project = Get-Content src/CGMCollage/CGMCollage.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release version: $version" }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists."; exit 0 }
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          foreach ($architecture in @("x64", "arm64")) {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name "CGM-Collage-Windows-$architecture" --dir release-assets
            if ($LASTEXITCODE -ne 0) { throw "Could not download $architecture installer" }
          }
          $installers = @("release-assets/CGM-Collage-Setup-x64.exe", "release-assets/CGM-Collage-Setup-arm64.exe")
          $checksums = foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer)) { throw "Missing installer: $installer" }
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($installer))"
          }
          $checksums | Set-Content release-assets/SHA256SUMS.txt -Encoding utf8
          gh release create $tag @installers release-assets/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "CGM Collage $version" --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw "Could not create release $tag" }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag" }
